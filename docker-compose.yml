services:
  postgres:
    image: postgres:17-alpine
    container_name: brevly-postgres
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: brevly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d brevly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Imagens minio/minio e minio/mc não estão mais disponíveis no Docker Hub;
  # chainguard publica builds atualizados do servidor e do cliente.
  minio:
    image: chainguard/minio:latest
    container_name: brevly-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # A imagem do cliente não tem shell: cada comando mc é um serviço one-shot.
  # restart on-failure repete até o servidor aceitar conexões.
  minio-create-bucket:
    image: chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ["mb", "--ignore-existing", "local/brevly"]
    restart: on-failure

  minio-public-bucket:
    image: chainguard/minio-client:latest
    depends_on:
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ["anonymous", "set", "download", "local/brevly"]

volumes:
  postgres-data:
  minio-data:
